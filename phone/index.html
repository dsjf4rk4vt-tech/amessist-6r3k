<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c20" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- 検索に出にくくする（公開の場所に置くため） -->
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AmeSSIST">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AmeSSIST</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<!-- 色・丸みの変数は、Mac版と同じ ../style.css を共用する。iPhone用の部品だけ phone.css -->
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<div id="ph"><header id="top"></header><main id="view"></main><nav id="tabs"></nav></div>
<div id="drawer"><div class="dr-bg" data-close-cal="1"></div><aside class="dr-panel" id="drp"></aside></div>
<!-- 「＋」（入力を追加）。id は pfab（Mac版の style.css の #fab と、見た目が混ざらないように） -->
<button id="pfab" class="pfab" data-add="1" aria-label="入力を追加"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
<!-- 入力を追加・送信待ちの一覧（シート） -->
<div id="sheet" hidden><div class="sh-bg" data-sheet-bg="1"></div><div class="sh-card" id="shc" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<!-- accept は付けない（付けると、iPhoneの選択画面で、.json が選べないことがあるため） -->
<input type="file" id="pick" hidden>
<script src="phone.js"></script>
</body>
</html>
